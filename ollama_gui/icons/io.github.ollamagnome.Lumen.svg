  <path d="M206 469 C230 515 1021 521 1047 469 L1040 494 C1008 546 249 549 213 493 Z" fill="url(#lipLight)"/>

  <path d="M420 249 C481 218 543 201 623 201 C706 201 774 218 832 247 C763 261 488 262 420 249 Z" fill="url(#capTop)" stroke="#48cdea" stroke-width="3"/>
  <path d="M420 252 C423 246 433 248 448 250 C549 256 731 257 814 249 C827 247 836 249 839 260 L848 305 C851 316 833 321 811 322 C711 328 515 328 431 319 C413 317 405 313 408 303 Z" fill="url(#cap)" stroke="url(#capEdge)" stroke-width="4"/>
  <path d="M433 251 C531 256 728 256 817 250" stroke="#67e5fc" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <path d="M414 309 C479 324 777 326 841 309" stroke="#052c4c" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
