  <use href="#bodyShape" fill="url(#body)" stroke="#063866" stroke-width="7"/>
  <use href="#bodyShape" fill="url(#bodyLight)"/>
  <path d="M258 556 C210 627 204 682 204 793 C204 943 237 1017 328 1041 C362 1050 393 1050 404 1074 C420 1104 397 1142 402 1157 C410 1186 473 1133 528 1099 C595 1056 603 1063 714 1063" stroke="#1d73a7" stroke-opacity=".25" stroke-width="9" stroke-linecap="round" clip-path="url(#bodyClip)"/>

  <!-- Thick cyan rim around the amber glass. -->
  <path d="M355 518 C282 530 247 600 244 684 C241 729 240 796 245 834 C254 920 297 950 390 965 C516 984 749 983 870 966 C969 951 1003 908 1009 828 C1014 775 1010 700 1006 667 C997 595 968 542 909 518 Z" fill="url(#rim)"/>
  <use href="#windowShape" fill="url(#glass)" stroke="#ffc564" stroke-width="2.5"/>
