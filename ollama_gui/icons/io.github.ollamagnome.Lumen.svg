      <stop stop-color="#5cceee"/><stop offset=".17" stop-color="#2889bb"/><stop offset="1" stop-color="#062d4b"/>
    </linearGradient>
    <path id="bodyShape" d="M272 494 C216 551 191 623 191 718 L191 808 C191 948 226 1016 301 1044 C328 1054 360 1055 383 1066 C410 1080 399 1115 393 1138 C387 1159 398 1177 417 1176 C455 1173 514 1114 566 1088 C600 1070 619 1070 657 1071 L812 1070 C921 1069 987 1044 1027 983 C1054 939 1065 886 1064 809 L1063 718 C1062 618 1033 551 986 497 Z"/>
    <path id="windowShape" d="M397 535 C329 535 284 581 275 657 C270 699 269 773 274 814 C280 891 315 923 393 942 C514 967 746 968 865 947 C943 934 976 899 981 821 C986 778 986 701 979 660 C966 578 922 535 857 535 Z"/>
    <clipPath id="windowClip"><use href="#windowShape"/></clipPath>
    <clipPath id="bodyClip"><use href="#bodyShape"/></clipPath>
  </defs>

  <!-- Carrying loop: a single hollow, closed vector path. -->
  <path d="M434 249 C432 145 512 57 620 55 C730 51 815 134 819 245 L746 245 C746 176 695 123 628 123 C558 122 506 177 508 245 Z" fill="url(#handle)" stroke="url(#handleEdge)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M497 225 C502 155 554 110 623 109 C693 107 749 156 755 226" stroke="#062f5a" stroke-opacity=".7" stroke-width="8"/>
  <path d="M445 204 C465 120 534 64 620 63 C714 60 788 125 807 206" stroke="#5ce4ff" stroke-opacity=".25" stroke-width="5" stroke-linecap="round"/>

