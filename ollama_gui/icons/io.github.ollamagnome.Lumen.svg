    </linearGradient>
    <linearGradient id="glass" x1="285" y1="591" x2="978" y2="825" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e3e5dc"/><stop offset=".16" stop-color="#f6bf75"/><stop offset=".46" stop-color="#ffce65"/><stop offset=".75" stop-color="#ffd384"/><stop offset="1" stop-color="#c5d9d7"/>
    </linearGradient>
    <radialGradient id="warmth" cx="626" cy="769" r="371" gradientTransform="translate(0 -154) scale(1 1.2)" gradientUnits="userSpaceOnUse">
