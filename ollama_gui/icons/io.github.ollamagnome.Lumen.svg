    <path d="M820 531 L864 529 L865 861 Q839 871 818 859 Z" fill="url(#barRight)"/>
    <path d="M433 545 L433 852" stroke="#ffc979" stroke-width="2" opacity=".55"/>
    <path d="M820 544 L820 852" stroke="#ffd17b" stroke-width="2" opacity=".5"/>
    <path d="M390 860 C440 881 532 887 627 888 C727 888 825 878 862 861 C871 860 877 866 879 879 L884 951 C756 978 495 978 370 947 L375 884 C376 870 380 864 390 860 Z" fill="url(#burner)"/>
