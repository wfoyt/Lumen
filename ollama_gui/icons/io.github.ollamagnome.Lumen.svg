    <linearGradient id="bar" x1="390" y1="696" x2="435" y2="698" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123653"/><stop offset=".38" stop-color="#2b4662"/><stop offset=".72" stop-color="#485064"/><stop offset="1" stop-color="#82654e"/>
