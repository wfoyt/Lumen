    <path d="M275 888 C309 805 932 805 981 887 L992 975 L262 975 Z" fill="url(#floor)"/>
    <path d="M286 878 C382 809 869 809 969 878" stroke="#ffda91" stroke-opacity=".55" stroke-width="6"/>
    <path d="M289 829 C287 713 289 613 331 577 C349 563 370 558 383 570 C352 620 332 706 335 787 Z" fill="url(#reflection)"/>
    <path d="M708 566 C763 554 800 564 825 585 L823 705 C796 648 758 603 708 566 Z" fill="#fff8da" opacity=".21"/>
    <path d="M859 582 C883 553 907 571 922 603 C940 642 940 697 934 747 C919 690 894 652 859 627 Z" fill="url(#reflection)"/>

