    <path d="M517 858 C502 855 489 819 490 786 C491 733 520 691 555 657 C582 630 596 611 606 587 C611 575 617 572 625 579 C675 610 728 661 750 718 C769 767 767 821 743 853 C736 870 542 868 517 858 Z" fill="url(#flame)" stroke="#fff9b1" stroke-width="1.5"/>
