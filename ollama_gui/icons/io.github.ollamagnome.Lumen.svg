<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Glowing lantern chat icon</title>
  <desc id="desc">An original vector illustration of a glossy blue lantern with a golden flame and a speech bubble shaped base. All artwork consists of scalable paths and gradients on a transparent background.</desc>
  <defs>
    <linearGradient id="handle" x1="625" y1="57" x2="625" y2="263" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31d7fb"/><stop offset=".16" stop-color="#288ed0"/><stop offset=".52" stop-color="#1e63a5"/><stop offset="1" stop-color="#103866"/>
    </linearGradient>
    <linearGradient id="handleEdge" x1="625" y1="60" x2="625" y2="251" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ae9ff"/><stop offset=".37" stop-color="#1685c5"/><stop offset="1" stop-color="#052d59"/>
    </linearGradient>
    <linearGradient id="body" x1="252" y1="576" x2="955" y2="1068" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1375b1"/><stop offset=".2" stop-color="#145a8e"/><stop offset=".48" stop-color="#154e7f"/><stop offset=".76" stop-color="#174779"/><stop offset="1" stop-color="#082b54"/>
    </linearGradient>
    <radialGradient id="bodyLight" cx="650" cy="689" r="530" gradientTransform="translate(0 -82) scale(1 1.12)" gradientUnits="userSpaceOnUse">
