[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-gnome"
dynamic = ["version"]
description = "Lumen: a native libadwaita chat app for Ollama with MCP tools"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.20,<2", "markdown-it-py>=3,<5", "pypdf>=5,<7", "Pillow>=10,<13", "latex2mathml>=3.81,<4", "ziamath>=0.13,<1", "CairoSVG>=2.7,<3"]

[project.scripts]
lumen = "ollama_gui.app:main"

[tool.setuptools.packages.find]
include = ["ollama_gui*"]

[tool.setuptools.dynamic]
version = {attr = "ollama_gui.__version__"}

[tool.setuptools.package-data]
ollama_gui = ["icons/*.svg", "icons/hicolor/scalable/apps/*.svg"]
